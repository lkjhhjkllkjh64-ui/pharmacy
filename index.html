<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cure Life Pharmacy</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{margin:0;background:#f6f7f9;color:#222}
.header{background:#0a7a3d;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{margin:0;font-size:18px}
.search{padding:12px;background:#fff;position:sticky;top:52px;z-index:99;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
.search input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:24px;font-size:14px;outline:none}
.search input:focus{border-color:#0a7a3d}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px;white-space:nowrap;background:#fff}
.cat{padding:6px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px}
.cat.active{background:#0a7a3d;color:#fff;border-color:#0a7a3d}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);position:relative;display:flex;flex-direction:column}
.card img{width:100%;height:120px;object-fit:contain;background:#fafafa;padding:8px}
.card-body{padding:10px;display:flex;flex-direction:column;flex:1}
.card-name{font-size:12px;font-weight:700;min-height:32px;line-height:1.3}
.card-price{margin-top:6px}
.old{font-size:11px;color:#999;text-decoration:line-through;margin-left:6px}
.final{font-size:15px;font-weight:800;color:#0a7a3d}
.points{background:#fff3cd;color:#856404;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;margin-top:6px;width:fit-content}
.discount{position:absolute;top:8px;right:8px;background:#ff4757;color:#fff;padding:4px 8px;border-radius:12px;font-size:11px;font-weight:800}
.btn{margin-top:8px;background:#111;color:#fff;border:none;padding:10px;border-radius:10px;font-size:13px;cursor:pointer;width:100%}
.btn:active{transform:scale(0.97)}
.badge-new{background:#0a7a3d;color:#fff;padding:10px;border-radius:12px;margin:12px;display:flex;justify-content:space-between;font-weight:800}
.cart{position:fixed;bottom:16px;left:16px;right:16px;background:#111;color:#fff;padding:14px 18px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;z-index:200;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;z-index:300;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.login-btn{background:#fff;color:#0a7a3d;border:1px solid #0a7a3d;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <h1>Cure Life 💊</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="userInfo" style="font-size:12px"></span>
    <button id="loginBtn" class="login-btn">دخول</button>
    <div style="background:#000;color:#fff;padding:6px 10px;border-radius:20px;font-size:12px">السلة <span id="cartCount">0</span></div>
  </div>
</div>
<div class="search"><input id="searchInput" placeholder="ابحث عن منتج... الاسم، الكود، الوصف"></div>
<div id="cats" class="cats"></div>
<div id="discountHeader" style="display:none" class="badge-new"><span>🔥 عروض الخصم - تظهر أولاً</span><span id="discountCount"></span></div>
<div id="grid" class="grid"></div>
<div id="cartBar" class="cart" style="display:none"><span>عرض السلة - <span id="cartTotal">0</span> جنيه</span><span>إتمام →</span></div>

<!-- Login Modal -->
<div id="loginModal" class="modal"><div class="modal-box">
  <h3>تسجيل دخول</h3>
  <input id="phoneInput" placeholder="رقم الهاتف" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0">
  <input id="nameInput" placeholder="الاسم" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0">
  <button id="doLogin" class="btn">دخول</button>
  <button onclick="closeModal('loginModal')" class="btn" style="background:#eee;color:#111;margin-top:8px">إغلاق</button>
</div></div>

<!-- Account Modal -->
<div id="accountModal" class="modal"><div class="modal-box">
  <h3>حسابي</h3>
  <div style="background:#0a7a3d;color:#fff;padding:16px;border-radius:12px;margin:10px 0">
    <div id="accName" style="font-weight:800"></div>
    <div id="accPoints" style="font-size:24px;margin:8px 0">0 ⭐</div>
    <div id="accPhone" style="font-size:12px;opacity:0.9"></div>
    <div id="accCode" style="font-size:11px;margin-top:6px;background:rgba(255,255,255,0.2);padding:4px 8px;border-radius:8px;width:fit-content"></div>
  </div>
  <button id="logoutBtn" class="btn" style="background:#ff4757">تسجيل خروج</button>
  <button onclick="closeModal('accountModal')" class="btn" style="background:#eee;color:#111;margin-top:8px">إغلاق</button>
</div></div>

<!-- Cart Modal -->
<div id="cartModal" class="modal"><div class="modal-box">
  <h3>سلة التسوق</h3>
  <div id="cartItems"></div>
  <div style="margin-top:12px;border-top:1px solid #eee;padding-top:12px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <select id="zoneSelect" style="padding:10px;border:1px solid #ddd;border-radius:10px"><option>جاري تحميل المناطق...</option></select>
      <input id="buildingInput" placeholder="العمارة" style="padding:10px;border:1px solid #ddd;border-radius:10px">
      <input id="floorInput" placeholder="الدور" style="padding:10px;border:1px solid #ddd;border-radius:10px">
      <input id="apartmentInput" placeholder="الشقة" style="padding:10px;border:1px solid #ddd;border-radius:10px">
      <input id="streetInput" placeholder="الشارع - يحفظ تلقائيا" style="padding:10px;border:1px solid #ddd;border-radius:10px">
    </div>
    <div style="margin-top:12px;font-weight:800">الإجمالي: <span id="cartTotal2">0</span> جنيه + توصيل <span id="deliveryFee">0</span></div>
    <div style="margin-top:6px;color:#0a7a3d">النقاط: <span id="cartPoints">0</span> نقطة</div>
    <button id="checkoutBtn" class="btn" style="background:#0a7a3d;margin-top:12px">إتمام الطلب</button>
    <button onclick="closeModal('cartModal')" class="btn" style="background:#eee;color:#111;margin-top:8px">إغلاق</button>
  </div>
</div></div>

<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwMEb_ETd_hsh4h5VlZLneoJpUC3mIaA5MVVIzRd3-lzcJl3fcZiG6TnP_nCu2LLMY/exec";
var allProducts = [];
var filtered = [];
var cart = JSON.parse(localStorage.getItem('cure_cart')||'[]');
var user = JSON.parse(localStorage.getItem('pharmacy_user')||'null');
var zones = [];

function jsonp(url, cb){
  var name = 'cb_'+Date.now()+'_'+Math.floor(Math.random()*1000);
  window[name]=function(d){ cb(d); delete window[name]; var s=document.getElementById(name); if(s) s.remove(); };
  var s=document.createElement('script'); s.id=name; s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+name+'&t='+Date.now(); document.head.appendChild(s);
}

function loadProducts(){
  // ✅ نفس كل حاجة - بس من شيت الاكواد المتاحة مش المنتجات
  jsonp(SCRIPT_URL, function(data){
    // data.codes = من شيت الاكواد المتاحة
    // data.products_map = تفاصيل المنتجات (صور + نقاط + عروض)
    if(data && data.codes){
      var pm = data.products_map || {};
      var seen = {};
      var list = [];
      data.codes.forEach(function(c){
        var qty = Number(c.quantity || 0);
        if(qty <= 0) return; // متاح فقط
        var p = c.product || pm[c.product_id] || pm[String(Number(c.product_id))];
        if(p && !seen[p.id]){
          seen[p.id]=true;
          list.push(p);
        }
      });
      // ترتيب العروض أولاً
      list.sort(function(a,b){
        if(a.hasDiscount && !b.hasDiscount) return -1;
        if(!a.hasDiscount && b.hasDiscount) return 1;
        if(a.hasDiscount && b.hasDiscount) return (b.discount_value||0)-(a.discount_value||0);
        return 0;
      });
      allProducts=list;
      filtered=list;
      renderCats();
      renderGrid();
      checkDiscountHeader();
      console.log('✅ من الأكواد المتاحة:', list.length);
    } else {
      document.getElementById('grid').innerHTML='<div style="padding:20px;text-align:center">فشل تحميل الأكواد المتاحة</div>';
    }
  });
}

function loadZones(){
  jsonp(SCRIPT_URL+'?action=zones', function(data){
    if(data && data.zones){
      zones=data.zones.filter(function(z){ return (z.active+'').toLowerCase()!=='false'; });
      var sel=document.getElementById('zoneSelect');
      sel.innerHTML='<option value="">اختر المنطقة</option>'+zones.map(function(z){ return '<option value="'+z.zone_name+'" data-fee="'+z.delivery_fee+'">'+z.zone_name+' - '+z.delivery_fee+' جنيه - '+z.delivery_time+'</option>'; }).join('');
      sel.onchange=function(){
        var opt=sel.options[sel.selectedIndex];
        document.getElementById('deliveryFee').textContent=opt.getAttribute('data-fee')||0;
        updateCartTotal();
      };
    }
  });
}

function loadCustomerPoints(){
  if(!user || !user.phone) return;
  jsonp(SCRIPT_URL+'?action=customer&phone='+encodeURIComponent(user.phone), function(data){
    if(data && typeof data.points!=='undefined'){
      user.points=data.points;
      user.name=data.name||user.name;
      localStorage.setItem('pharmacy_user', JSON.stringify(user));
      updateUserUI();
    }
  });
}

function renderCats(){
  var catsSet=new Set(); allProducts.forEach(function(p){ if(p.category) catsSet.add(p.category); });
  var cats=['الكل'].concat(Array.from(catsSet));
  document.getElementById('cats').innerHTML=cats.map(function(c,i){ return '<div class="cat '+(i===0?'active':'')+'" onclick="filterCat(this,\''+c.replace(/'/g,"\\'")+'\')">'+c+'</div>'; }).join('');
}

function filterCat(el, cat){
  document.querySelectorAll('.cat').forEach(function(c){ c.classList.remove('active'); });
  el.classList.add('active');
  applyFilter();
}

function applyFilter(){
  var q=document.getElementById('searchInput').value.toLowerCase().trim();
  var activeCat=document.querySelector('.cat.active');
  var cat=activeCat?activeCat.textContent:'الكل';
  filtered=allProducts.filter(function(p){
    var matchCat = (cat==='الكل' || p.category===cat);
    var matchQ = !q || p.name.toLowerCase().indexOf(q)>-1 || p.id.toLowerCase().indexOf(q)>-1;
    return matchCat && matchQ;
  });
  renderGrid();
}

function renderGrid(){
  var grid=document.getElementById('grid');
  grid.innerHTML=filtered.map(function(p){
    var img = p.image_link || p.image || '';
    if(img && img.indexOf('drive.google')>-1){
      // convert drive link
      var m=img.match(/\/d\/([^\/]+)/); if(m) img='https://drive.google.com/uc?export=view&id='+m[1];
    }
    if(!img) img='https://via.placeholder.com/200x120?text=💊';
    var hasDisc = p.hasDiscount || p.discount_value>0;
    var discBadge = hasDisc? '<div class="discount">'+p.discount_value+'% خصم</div>' : '';
    var oldPrice = hasDisc? '<span class="old">'+p.base_price+' ج</span>' : '';
    var finalP = p.finalPrice || p.price || p.base_price;
    var points = p.points_earned || p.points || 1;
    return '<div class="card">'+discBadge+
      '<img src="'+img+'" onerror="this.src=\'https://via.placeholder.com/200x120?text=💊\'" loading="lazy">'+
      '<div class="card-body">'+
      '<div class="card-name">'+p.name+'</div>'+
      '<div class="card-price">'+oldPrice+'<span class="final">'+finalP+' ج</span></div>'+
      '<div class="points">🎁 '+points+' نقطة</div>'+
      '<button class="btn" onclick="addToCart(\''+p.id.replace(/'/g,"\\'")+'\')">إضافة للسلة</button>'+
      '</div></div>';
  }).join('');
}

function checkDiscountHeader(){
  var discCount = allProducts.filter(function(p){ return p.hasDiscount; }).length;
  if(discCount>0){
    document.getElementById('discountHeader').style.display='flex';
    document.getElementById('discountCount').textContent=discCount+' منتج';
  }
}

function addToCart(id){
  var p=allProducts.find(function(x){ return x.id===id; });
  if(!p) return;
  var found=cart.find(function(c){ return c.id===id; });
  if(found){ found.qty+=1; } else { cart.push({id:id, name:p.name, price:(p.finalPrice||p.base_price), points:(p.points_earned||1), qty:1}); }
  saveCart(); updateCartUI();
}

function saveCart(){ localStorage.setItem('cure_cart', JSON.stringify(cart)); }
function updateCartUI(){
  var count=cart.reduce(function(s,c){ return s+c.qty; },0);
  var total=cart.reduce(function(s,c){ return s+c.price*c.qty; },0);
  var pts=cart.reduce(function(s,c){ return s+c.points*c.qty; },0);
  document.getElementById('cartCount').textContent=count;
  document.getElementById('cartTotal').textContent=total.toFixed(1);
  document.getElementById('cartTotal2').textContent=total.toFixed(1);
  document.getElementById('cartPoints').textContent=pts;
  document.getElementById('cartBar').style.display= count>0?'flex':'none';
  // render items
  document.getElementById('cartItems').innerHTML=cart.map(function(c){ return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>'+c.name+' x'+c.qty+'</span><span>'+(c.price*c.qty).toFixed(1)+' ج <button onclick="removeCart(\''+c.id+'\')" style="margin-right:8px">✕</button></span></div>'; }).join('') || '<div>السلة فاضية</div>';
}
function removeCart(id){ cart=cart.filter(function(c){ return c.id!==id; }); saveCart(); updateCartUI(); }

function updateUserUI(){
  if(user && user.phone){
    document.getElementById('userInfo').innerHTML='<span style="background:#fff;color:#0a7a3d;padding:4px 8px;border-radius:12px;cursor:pointer" onclick="openAccount()">'+(user.name||'حسابي')+' - '+(user.points||0)+' ⭐</span>';
    document.getElementById('loginBtn').textContent='حسابي';
    document.getElementById('loginBtn').onclick=openAccount;
  } else {
    document.getElementById('userInfo').innerHTML='';
    document.getElementById('loginBtn').textContent='دخول';
    document.getElementById('loginBtn').onclick=function(){ openModal('loginModal'); };
  }
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function openAccount(){
  if(!user) { openModal('loginModal'); return; }
  document.getElementById('accName').textContent=user.name||'عميل';
  document.getElementById('accPhone').textContent=user.phone;
  document.getElementById('accPoints').textContent=(user.points||0)+' ⭐';
  document.getElementById('accCode').textContent='كود الدعوة: '+(user.referral_code||user.code||'MOHZ760');
  openModal('accountModal');
}

document.getElementById('doLogin').onclick=function(){
  var phone=document.getElementById('phoneInput').value.trim();
  var name=document.getElementById('nameInput').value.trim()||'عميل';
  if(!phone){ alert('ادخل رقم الهاتف'); return; }
  user={phone:phone, name:name, points:0};
  localStorage.setItem('pharmacy_user', JSON.stringify(user));
  closeModal('loginModal');
  updateUserUI();
  loadCustomerPoints();
};

document.getElementById('logoutBtn').onclick=function(){
  localStorage.removeItem('pharmacy_user');
  user=null;
  updateUserUI();
  closeModal('accountModal');
};

document.getElementById('cartBar').onclick=function(){ openModal('cartModal'); };

document.getElementById('searchInput').oninput=applyFilter;

document.getElementById('checkoutBtn').onclick=function(){
  if(cart.length===0){ alert('السلة فاضية'); return; }
  var zone=document.getElementById('zoneSelect').value;
  if(!zone){ alert('اختر المنطقة'); return; }
  var building=document.getElementById('buildingInput').value;
  var floor=document.getElementById('floorInput').value;
  var apartment=document.getElementById('apartmentInput').value;
  var street=document.getElementById('streetInput').value;
  var total=cart.reduce(function(s,c){ return s+c.price*c.qty; },0);
  var points=cart.reduce(function(s,c){ return s+c.points*c.qty; },0);
  var orderData={
    phone:user?user.phone:document.getElementById('phoneInput').value||'',
    name:user?user.name:'عميل',
    zone:zone,
    building:building,
    floor:floor,
    apartment:apartment,
    street:street,
    grand_total:total,
    total_points:points,
    items:cart.map(function(c){ return {name:c.name, qty:c.qty, points:c.points}; }),
    orderCode:'ORD'+Date.now().toString().slice(-6)
  };
  if(!orderData.phone){ alert('سجل دخول أولا'); openModal('loginModal'); return; }
  // Save address
  localStorage.setItem('ultra_address_v1', JSON.stringify({building:building,floor:floor,apartment:apartment,street:street,zone:zone}));
  fetch(SCRIPT_URL, {method:'POST', body:new URLSearchParams({data:JSON.stringify(orderData)})})
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res.success){
        alert('تم الطلب بنجاح! رقم الطلب: '+res.order_id+' - النقاط: '+res.points);
        cart=[]; saveCart(); updateCartUI(); closeModal('cartModal');
        if(user){ loadCustomerPoints(); }
      } else { alert('خطأ: '+(res.error||'حاول مرة أخرى')); }
    }).catch(function(){ alert('تم إرسال الطلب - سيظهر في الشيت'); cart=[]; saveCart(); updateCartUI(); closeModal('cartModal'); });
};

// Init
loadProducts(); loadZones(); updateCartUI(); updateUserUI(); if(user) loadCustomerPoints();
var savedAddr=JSON.parse(localStorage.getItem('ultra_address_v1')||'null');
if(savedAddr){ document.getElementById('buildingInput').value=savedAddr.building||''; document.getElementById('floorInput').value=savedAddr.floor||''; document.getElementById('apartmentInput').value=savedAddr.apartment||''; document.getElementById('streetInput').value=savedAddr.street||''; }
</script>
</body>
</html>
