// ===== SMART SEARCH AR/EN FUZZY - V2 - DEFINED FIRST =====
function normalizeArabic(s){
  if(!s) return '';
  return s.toString().toLowerCase()
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/ؤ/g,'و')
    .replace(/ئ/g,'ي')
    .replace(/[\u064B-\u065F\u0670]/g,'')
    .trim();
}
function normalizeEn(s){ return s.toString().toLowerCase().trim(); }
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(Math.abs(m-n)>4) return 10;
  const dp=Array(n+1).fill(0).map((_,i)=>i);
  for(let i=1;i<=m;i++){
    let prev=dp[0]; dp[0]=i;
    for(let j=1;j<=n;j++){
      let cur=dp[j];
      dp[j]=Math.min(dp[j]+1, dp[j-1]+1, prev + (a[i-1]===b[j-1]?0:1));
      prev=cur;
    }
  }
  return dp[n];
}

window.smartMatch = function(product, query){
  if(!query) return true;
  const q = query.trim().toLowerCase();
  if(!q) return true;
  const qAr = normalizeArabic(q);
  const qEn = normalizeEn(q);
  
  const fieldsRaw = [
    (product.name||''),
    (product.code||''),
    (product.desc||''),
    (product.category||''),
    (product.badge||''),
  ].join(' ');
  const fields = fieldsRaw.toLowerCase();
  const fieldsAr = normalizeArabic(fieldsRaw);
  const fieldsEn = normalizeEn(fieldsRaw);
  
  // 1. Direct
  if(fields.includes(q)) return true;
  if(fieldsAr.includes(qAr)) return true;
  
  // 2. Dictionary expansion for query
  let expanded = new Set([q, qAr, qEn]);
  for(let ar in window.__AR_EN_MAP__){
    const ens = window.__AR_EN_MAP__[ar];
    const arNorm = normalizeArabic(ar);
    // if query matches arabic key
    if(qAr.includes(arNorm) || arNorm.includes(qAr)){
      ens.forEach(e=>{ expanded.add(e.toLowerCase()); expanded.add(normalizeArabic(e)); });
    }
    // if query matches any english synonym
    for(let en of ens){
      if(qEn.includes(en.toLowerCase()) || en.toLowerCase().includes(qEn)){
        expanded.add(arNorm);
        expanded.add(ar);
        ens.forEach(e=> expanded.add(e.toLowerCase()));
      }
    }
  }
  // also reverse: if product contains something that maps to query
  // Check expanded terms against fields
  for(let term of expanded){
    if(!term || term.length<2) continue;
    if(fields.includes(term)) return true;
    if(fieldsAr.includes(normalizeArabic(term))) return true;
    if(fieldsEn.includes(normalizeEn(term))) return true;
  }
  
  // 3. Fuzzy word level
  const qWords = qAr.split(/\s+/).filter(w=>w.length>=2);
  const prodWords = (fieldsAr + ' ' + fieldsEn).split(/\s+/).filter(w=>w.length>=2);
  for(let qw of qWords){
    for(let pw of prodWords){
      if(pw.includes(qw) || qw.includes(pw)) return true;
      if(qw.length>=3 && pw.length>=3){
        if(levenshtein(qw, pw)<=1) return true;
        if(qw.length>=4 && levenshtein(qw, pw)<=2) return true;
      }
    }
  }
  return false;
};

document.addEventListener('DOMContentLoaded', ()=>{
  function cleanDebug(){
    document.body.innerHTML = document.body.innerHTML
      .replace(/النقاط من شيت base • العمود M/g, '')
      .replace(/نقطة • من العمود M/g, 'نقطة')
      .replace(/من العمود M/g, '')
      .replace(/Ultra Light Old Design.*?Cache 5 دقائق/g, 'Cure Life Pharmacy');
  }
  // Run after render
  setTimeout(()=>{
    // More precise DOM cleanup without breaking React
    document.querySelectorAll('span, div, p').forEach(el=>{
      if(el.textContent && el.textContent.includes('من العمود M')){
        // If it's exactly "X نقطة • من العمود M", replace with "X نقطة"
        el.textContent = el.textContent.replace(/\s*•\s*من العمود M/g, '').replace(/من العمود M/g, '').trim();
      }
      if(el.textContent && el.textContent.includes('النقاط من شيت base')){
        el.style.display='none';
      }
    });
  }, 1000);
  setInterval(()=>{
    document.querySelectorAll('span, div, p').forEach(el=>{
      if(el.textContent && el.textContent.includes('من العمود M') && el.textContent.includes('نقطة')){
        el.textContent = el.textContent.replace(/\s*•\s*من العمود M/g, '').replace(/من العمود M/g, '').trim();
      }
    });

<script>
// ===== FIX FOR GOOGLE APPS SCRIPT - USE FORM SUBMIT INSTEAD OF FETCH =====
function sendToGoogleSheet(h){
  try{
    const EXEC = "https://script.google.com/macros/s/AKfycbzV_ngXN_hd9mOmvSLx50_rYTt1c9V_t-fj9B-_Zfszy6EipqQQmYhJSiMrAQGduY7K/exec";
    if (!h.total_points || h.total_points==0) {
      h.total_points = Math.floor((h.grand_total||h.total||h.total_price||250)/10)||5;
    }
    // Create hidden iframe
    let iframeName = "gsheet_iframe_"+Date.now();
    let iframe = document.createElement("iframe");
    iframe.name = iframeName;
    iframe.style.display = "none";
    document.body.appendChild(iframe);
    
    // Create form
    let form = document.createElement("form");
    form.method = "POST";
    form.action = EXEC;
    form.target = iframeName;
    form.style.display = "none";
    
    let data = {data: JSON.stringify(h), ordersOrderCode: h.orderCode, ordersPhone: h.phone, ordersName: h.name, grandTotal: h.grand_total||h.total||0, phone: h.phone, total_points: h.total_points, totalPoints: h.total_points};
    for(let k in data){
      let inp = document.createElement("input");
      inp.type = "hidden";
      inp.name = k;
      inp.value = data[k];
      form.appendChild(inp);
    }
    document.body.appendChild(form);
    form.submit();
    console.log("✅ Order submitted via FORM to Google Sheet", h.orderCode, h.total_points);
    setTimeout(()=>{ try{document.body.removeChild(form); document.body.removeChild(iframe);}catch(e){} }, 5000);
    
    // No backup fetch - form only to prevent duplicate
    
    return true;
  }catch(e){ console.log("Form submit error", e); return false; }
}
</script>

function formatTelegramMessage(orderData, userInfo, locationInfo){
  try{
    let items = orderData.items || [];
    let itemsText = items.map((it, i) => {
      return `${i+1}. ${it.name} (${it.code||''})\n   الكمية: ${it.qty} × ${it.price} ج = ${(it.qty*it.price).toFixed(2)} ج | ⭐ ${it.points_total||0}`;
    }).join("\n");
    let msg = `🛒 *طلب جديد - Cure Life Pharmacy*\n`;
    msg += `━━━━━━━━━━━━━━━\n`;
    msg += `📦 *كود الطلب:* ${orderData.orderCode || 'ORD-'+Date.now().toString().slice(-6)}\n`;
    msg += `👤 *العميل:* ${orderData.name || userInfo?.name || '-'} \n`;
    msg += `📱 *الهاتف:* ${orderData.phone || userInfo?.phone || '-'} \n`;
    if(userInfo && userInfo.totalPoints) msg += `⭐ *نقاط العميل:* ${userInfo.totalPoints}\n`;
    msg += `\n📍 *العنوان:*\n`;
    msg += `   المنطقة: ${orderData.zone||'-'}\n`;
    msg += `   عمارة: ${orderData.building||'-'} - دور: ${orderData.floor||'-'} - شقة: ${orderData.apartment||'-'}\n`;
    msg += `   الشارع: ${orderData.street||'-'}\n`;
    if(locationInfo && locationInfo.link) msg += `   🗺️ الموقع: ${locationInfo.link}\n`;
    if(locationInfo && locationInfo.distance) msg += `   📏 المسافة: ${locationInfo.distance.toFixed(1)} كم\n`;
    msg += `\n🛍️ *المنتجات:*\n${itemsText||'-'}\n`;
    msg += `\n💰 *الإجمالي:*\n`;
    msg += `   المنتجات: ${(orderData.total_price||0).toFixed(2)} ج\n`;
    msg += `   الشحن: ${(orderData.shipping||0).toFixed(2)} ج\n`;
    if(orderData.coupon) msg += `   كود خصم: ${orderData.coupon} (-${orderData.coupon_discount||0})\n`;
    msg += `   *الإجمالي النهائي: ${(orderData.grand_total||0).toFixed(2)} ج*\n`;
    msg += `   ⭐ إجمالي النقاط: ${orderData.total_points||0}\n`;
    msg += `\n🕐 ${new Date().toLocaleString('ar-EG')}\n`;
    msg += `━━━━━━━━━━━━━━━`;
    return msg;
  }catch(e){ return `طلب جديد: ${JSON.stringify(orderData).slice(0,1000)}`; }
}
async function sendOrderToTelegram(orderData){
  try{
    const cfg = window.TELEGRAM_CONFIG;
    if(!cfg || !cfg.enabled) return;
    let userInfo = null; try{ userInfo = JSON.parse(localStorage.getItem('pharmacy_user')||'null'); }catch(e){}
    let locInfo = null; try{ locInfo = JSON.parse(localStorage.getItem('user_location_simple')||'null'); }catch(e){}
    const message = formatTelegramMessage(orderData, userInfo, locInfo);
    const url = `https://api.telegram.org/bot${cfg.botToken}/sendMessage`;
    await fetch(url, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ chat_id: cfg.chatId, text: message, parse_mode: 'Markdown' })
    });
    console.log("✅ Telegram sent");
  }catch(err){ console.error("Telegram error", err); }
}
window.__LAST_ORDER__ = null;
</script>

(function(){

  function setLocation(data){ localStorage.setItem(LOCATION_KEY, JSON.stringify({...data, timestamp:new Date().toISOString()})); }
  async function fetchCsv(url){
    const bust="&t="+Date.now();
    try{ const r=await fetch(url+bust); if(r.ok){ const t=await r.text(); if(t && t.length>10) return t; } }catch(e){}
    try{ const r=await fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(url+bust)); if(r.ok){ const t=await r.text(); if(t && t.length>10) return t; } }catch(e){}

  }
  function parseUsers(txt){
    if(!txt) return [];
    const lines=txt.trim().split(/\r?\n/); const rows=[];
    for(let i=1;i<lines.length;i++){ const l=lines[i]; if(!l.trim()) continue; const c=l.split(",").map(x=>x.trim().replace(/^\"|\"$/g,"")); if(c[0]) rows.push({phone:c[0], name:c[1]||"", inviteCode:c[2]||"", totalPoints:parseInt(c[5])||0}); }
    return rows;
  }
  function calculateDistance(lat1, lon1, lat2, lon2){
    const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180;
    const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

    const m=link.match(/(-?\d+\.\d+),\s*(-?\d+\.\d+)/);

  function closeModal(){ const m=document.getElementById("loginModalBg"); if(m) m.remove(); }

    closeModal();
    const bg=document.createElement("div"); bg.className="login-modal-bg"; bg.id="loginModalBg"; bg.onclick=function(e){ if(e.target===bg) closeModal(); };
    bg.innerHTML='<div class="login-modal" onclick="event.stopPropagation()"><div style="display:flex; justify-content:space-between; margin-bottom:14px"><h3 style="font-weight:800">👤 دخول</h3><button onclick="document.getElementById(\'loginModalBg\').remove()" style="background:#f4f4f5; width:28px; height:28px; border-radius:9999px; border:none">✕</button></div><input id="loginPhoneInput" placeholder="01xxxxxxxxx" style="width:100%; border:2px solid #e4e4e7; border-radius:10px; padding:12px; margin-bottom:10px; font-size:13px" inputmode="numeric" /><button id="loginDoBtn" style="width:100%; background:#16a34a; color:white; padding:12px; border-radius:10px; font-weight:700; border:none">دخول</button></div>';
    document.body.appendChild(bg); document.getElementById("loginDoBtn").onclick=doLogin;
  }

  function createLocationField(){
    let addressSection=null;
    for(let div of document.querySelectorAll('div')){ if(div.textContent.includes("عنوان التوصيل") && div.textContent.includes("يحفظ تلقائيا")){ addressSection=div; break; } }
    if(!addressSection) return false; if(document.getElementById("locationSimpleContainer")) return true;
    let container=addressSection.parentElement; let depth=0; while(container && depth<5){ if(container.querySelectorAll('input').length>=4) break; container=container.parentElement; depth++; }
    const savedLoc=getLocation(); const locDiv=document.createElement("div"); locDiv.id="locationSimpleContainer"; locDiv.className="location-simple " + (savedLoc ? "valid" : "mandatory");
    locDiv.innerHTML='<div style="display:flex; justify-content:space-between; margin-bottom:8px"><label style="font-size:12px; font-weight:800; color:#16a34a">📍 موقعك *</label><span style="font-size:9px; color:white; background:#16a34a; padding:3px 8px; border-radius:9999px">حتى 8 كم</span></div><button id="openMapsSimpleBtn" class="loc-btn maps" style="padding:10px; font-size:12px">🗺️ فتح الخرائط</button><input id="locationSimpleInput" class="loc-input" placeholder="الصق الإحداثيات أو الرابط" value="'+(savedLoc ? savedLoc.link||"" : "")+'" /><div id="locationSimpleSuccess" class="loc-success" style="'+(savedLoc && savedLoc.distance <= PHARMACY_LOCATION.maxDistanceKm ? 'display:block' : 'display:none')+'">✅ يبعد '+(savedLoc && savedLoc.distance ? savedLoc.distance.toFixed(1)+' كم' : '')+'</div><div id="locationDistanceError" class="loc-error-distance"><div style="font-size:24px">😔</div><div style="font-size:13px; font-weight:800; color:#dc2626">نأسف لعدم التوصيل</div><div id="distanceErrorText" style="font-size:11px; color:#991b1b"></div></div>';
    const streetInput=Array.from(container.querySelectorAll('input')).find(i=> (i.placeholder||"").includes("الشارع"));
    if(streetInput && streetInput.parentElement){ streetInput.parentElement.parentElement.appendChild(locDiv); }else{ container.appendChild(locDiv); }
    document.getElementById("openMapsSimpleBtn").onclick=function(){ window.open("https://www.google.com/maps?q="+PHARMACY_LOCATION.lat+","+PHARMACY_LOCATION.lng, "_blank"); };
    const input=document.getElementById("locationSimpleInput"); input.addEventListener("input", async function(e){ await handleLocationInput(e.target.value.trim()); });
    if(savedLoc && savedLoc.link){ setTimeout(function(){ handleLocationInput(savedLoc.link); }, 500); }
    return true;
  }
  async function handleLocationInput(link){
    let coords = extractCoordsFromLink(link);
    const successDiv=document.getElementById("locationSimpleSuccess"); const errorDiv=document.getElementById("locationDistanceError"); const errorText=document.getElementById("distanceErrorText"); const container=document.getElementById("locationSimpleContainer");
    if(!coords){ if(successDiv) successDiv.style.display="none"; if(errorDiv) errorDiv.style.display="none"; setLocation({link, lat:null, lng:null, distance:null}); return; }
    const distance=calculateDistance(coords.lat, coords.lng, PHARMACY_LOCATION.lat, PHARMACY_LOCATION.lng);
    lastDistanceCheck={coords, distance, link};
    if(distance<=PHARMACY_LOCATION.maxDistanceKm){ setLocation({link, lat:coords.lat, lng:coords.lng, distance}); if(successDiv){ successDiv.style.display="block"; successDiv.innerHTML="✅ <b>"+distance.toFixed(1)+" كم</b> ✅"; } if(errorDiv) errorDiv.style.display="none"; if(container){ container.classList.remove("mandatory","invalid"); container.classList.add("valid"); } }
    else{ setLocation({link, lat:coords.lat, lng:coords.lng, distance}); if(successDiv) successDiv.style.display="none"; if(errorDiv){ errorDiv.style.display="block"; if(errorText){ errorText.innerHTML="يبعد <b>"+distance.toFixed(1)+" كم</b> - حتى "+PHARMACY_LOCATION.maxDistanceKm+" كم"; } } if(container){ container.classList.remove("mandatory","valid"); container.classList.add("invalid"); } }
  }
  function validateLocationSimple(){
    const loc=getLocation(); const inp=document.getElementById("locationSimpleInput");
    const hasLink=(loc&&loc.link)||(inp&&inp.value.trim()); if(!hasLink) return {valid:false, reason:"no_location"};
    if(lastDistanceCheck&&lastDistanceCheck.distance>PHARMACY_LOCATION.maxDistanceKm){ return {valid:false, reason:"too_far", distance:lastDistanceCheck.distance}; }
    if(loc&&loc.distance&&loc.distance>PHARMACY_LOCATION.maxDistanceKm){ return {valid:false, reason:"too_far", distance:loc.distance}; }
    const currentLink=inp?inp.value.trim():(loc?loc.link:""); const coords=extractCoordsFromLink(currentLink);
    if(coords){ const dist=calculateDistance(coords.lat, coords.lng, PHARMACY_LOCATION.lat, PHARMACY_LOCATION.lng); if(dist>PHARMACY_LOCATION.maxDistanceKm){ return {valid:false, reason:"too_far", distance:dist}; } return {valid:true, distance:dist}; }
    return {valid:true, distance:null};
  }
  document.addEventListener('click', function(e){ const btn=e.target.closest('button'); if(!btn) return; const txt=(btn.textContent||"").trim(); if(txt.includes('إضافة')&&txt.includes('السلة')){ const toast=document.getElementById('addToast'); if(toast){ toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); },2000); } } }, true);
  function hookOrderButton(){
    let attempts=0; const interval=setInterval(function(){ attempts++; const orderBtn=Array.from(document.querySelectorAll('button')).find(b=> b.textContent.includes("إتمام الطلب")); if(orderBtn&&!orderBtn.dataset.locationHooked){ orderBtn.dataset.locationHooked="true"; orderBtn.addEventListener("click", function(e){ const v=validateLocationSimple(); if(!v.valid){ e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation(); const field=document.getElementById("locationSimpleContainer"); if(field){ field.scrollIntoView({behavior:"smooth", block:"center"}); } if(v.reason==="too_far"){ alert("😔 نأسف لعدم التوصيل\nيبعد "+v.distance.toFixed(1)+" كم - حتى "+PHARMACY_LOCATION.maxDistanceKm+" كم فقط"); } else{ alert("⚠️ الموقع إجباري"); } return false; } }, true); } if(attempts>40) clearInterval(interval); },800);
  }
  const originalFetch=window.fetch;
  window.fetch=async function(url, opts){
    try{
      if(typeof url==="string"&&url.includes("script.google.com")&&opts&&opts.body instanceof FormData){
        const loc=getLocation(); const inp=document.getElementById("locationSimpleInput"); let finalLink=""; if(loc&&loc.link) finalLink=loc.link; else if(inp&&inp.value.trim()) finalLink=inp.value.trim();
        if(!finalLink){ alert("⚠️ الموقع إجباري!"); throw new Error("Location required"); }
        const validation=validateLocationSimple(); if(!validation.valid&&validation.reason==="too_far"){ alert("😔 نأسف لعدم التوصيل\n"+validation.distance.toFixed(1)+" كم"); throw new Error("Too far"); }
        const user=getUser();
        if(user){ let cartPoints=0; try{ cartPoints=window.__PHARMACY_TOTAL_POINTS__||0; }catch(e){} const orderCode="ORD"+Date.now().toString().slice(-6); opts.body.append("userPhone", user.phone); opts.body.append("userName", user.name); opts.body.append("pointsEarned", cartPoints.toString()); opts.body.append("orderCode", orderCode); const newTotal=(user.totalPoints||0)+cartPoints; opts.body.append("pointsTotalNew", newTotal.toString()); opts.body.append("ordersAction","newOrder"); opts.body.append("ordersOrderCode", orderCode); opts.body.append("ordersPhone", user.phone); opts.body.append("ordersName", user.name); opts.body.append("ordersLocation", finalLink); opts.body.append("locationLink", finalLink); if(validation.distance) opts.body.append("distanceKm", validation.distance.toFixed(2)); if(lastDistanceCheck){ opts.body.append("locationLat", lastDistanceCheck.coords.lat); opts.body.append("locationLng", lastDistanceCheck.coords.lng); } user.totalPoints=newTotal; setUser(user); }
        else{ opts.body.append("ordersLocation", finalLink); opts.body.append("locationLink", finalLink); if(validation.distance) opts.body.append("distanceKm", validation.distance.toFixed(2)); opts.body.append("ordersAction","newOrder"); opts.body.append("ordersOrderCode","ORD"+Date.now().toString().slice(-6)); }
      }
    }catch(err){ if(err.message==="Location required"||err.message==="Too far") return Promise.reject(err); }
    return originalFetch.apply(this, arguments);
  };
  function init(){
    renderLogin(); 
    let locAttempts=0; const locInterval=setInterval(function(){ locAttempts++; const c=createLocationField(); if(c||locAttempts>30) clearInterval(locInterval); },800);
    setTimeout(createLocationField, 1200); setTimeout(hookOrderButton, 1800);
    const observer=new MutationObserver(function(){ createLocationField(); hookOrderButton(); if(!document.getElementById("floatLoginBtn")) renderLogin(); });
    observer.observe(document.body,{childList:true, subtree:true});
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", init); }else{ init(); }
  setTimeout(renderLogin, 100);
})();
</script>





<script>
// ===== AUTO-FILL FIXED V2 - ONLY CHECKOUT FORM =====
function getPharmacyUser(){
  try{
    const u = JSON.parse(localStorage.getItem('pharmacy_user')||'null');
    if(u && u.phone) return u;
  }catch(e){}
  return null;
}
function getAddressData(){
  try{
    return JSON.parse(localStorage.getItem('ultra_address_v1')||'null');
  }catch(e){return null}
}
function setAddressData(newData){
  try{
    const cur = getAddressData()||{};
    const merged = {...cur, ...newData};
    localStorage.setItem('ultra_address_v1', JSON.stringify(merged));
  }catch(e){}
}

function isCheckoutInput(inp){
  // Only inputs inside address section (عنوان التوصيل)
  let parent = inp.closest('div');
  let depth=0;
  while(parent && depth<8){
    if(parent.textContent && parent.textContent.includes('عنوان التوصيل')){
      return true;
    }
    // Also check if parent is in the cart modal (سلة التسوق)
    if(parent.textContent && parent.textContent.includes('سلة التسوق')){
      // But exclude the search input at top - search input is NOT inside سلة التسوق modal, it's in main page
      // So if we are inside سلة التسوق, it's okay to check placeholders
      const txt = parent.textContent;
      if(txt.includes('عنوان التوصيل')){
        return true;
      }
    }
    parent = parent.parentElement;
    depth++;
  }
  return false;
}

function autoFillCheckout(){
  const user = getPharmacyUser();
  if(!user) return;
  
  // Sync to localStorage for React state
  if(user.name || user.phone){
    const cur = getAddressData()||{};
    let changed=false;
    if(user.name && !cur.name){ cur.name=user.name; changed=true; }
    if(user.phone && !cur.phone){ cur.phone=user.phone; changed=true; }
    if(changed) setAddressData(cur);
  }
  
  // Find checkout form inputs ONLY - by looking for the container that has عنوان التوصيل
  const checkoutContainers = Array.from(document.querySelectorAll('div')).filter(div=>{
    return div.textContent && div.textContent.includes('عنوان التوصيل - يحفظ تلقائيا');
  });
  
  if(checkoutContainers.length===0) return;
  
  checkoutContainers.forEach(container=>{
    const inputs = container.parentElement ? container.parentElement.querySelectorAll('input') : container.querySelectorAll('input');
    // Actually get all inputs in the same modal - closest large container
    let modal = container;
    let d=0;
    while(modal && d<5){
      if(modal.querySelectorAll('input').length>=4) break;
      modal = modal.parentElement;
      d++;
    }
    if(!modal) return;
    
    modal.querySelectorAll('input').forEach(inp=>{
      const ph = (inp.placeholder||'').trim();
      // Exact match only for checkout fields
      if(ph === 'الاسم' && user.name && (!inp.value || inp.value.trim()==='')){
        const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
        setter.call(inp, user.name);
        inp.dispatchEvent(new Event('input', {bubbles:true}));
        inp.dispatchEvent(new Event('change', {bubbles:true}));
      }
      if(ph === 'رقم الهاتف *' && user.phone && (!inp.value || inp.value.trim()==='')){
        const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
        setter.call(inp, user.phone);
        inp.dispatchEvent(new Event('input', {bubbles:true}));
        inp.dispatchEvent(new Event('change', {bubbles:true}));
      }
    });
  });
}

document.addEventListener('DOMContentLoaded', ()=>{
  setInterval(()=>{
    // Only run if checkout is visible
    if(document.body.textContent.includes('عنوان التوصيل')){
      autoFillCheckout();
    }
    // Safety: clear search input if it accidentally contains user name (fix previous bug)
    const searchInputs = document.querySelectorAll('input[placeholder*="ابحث عن منتج"]');
    searchInputs.forEach(si=>{
      const val = si.value||'';
      const user = getPharmacyUser();
      if(user && user.name && val.includes(user.name) && val.length < 50){
        // If search contains full name like "محمد أحمد السيد", clear it if user didn't type it as search
        // Check if it's exactly the name
        if(val.trim() === user.name.trim()){
          si.value = '';
          const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
          setter.call(si, '');
          si.dispatchEvent(new Event('input', {bubbles:true}));
        }
      }
    });
  }, 800);
  
  const obs = new MutationObserver(()=>{
    if(document.body.textContent.includes('عنوان التوصيل')){
      autoFillCheckout();
    }
  });
  obs.observe(document.body, {childList:true, subtree:true});
});
console.log('✅ Auto-fill FIXED V2 - only checkout');
</script>
